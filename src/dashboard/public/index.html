<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram AI AutoPilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, system-ui, sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
        .log-container { height: 400px; overflow-y: auto; background: #010409; font-family: monospace; }
        .stat-circle { padding-top: 100%; border-radius: 50%; position: relative; border: 4px solid #238636; }
        .stat-value { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold flex items-center text-white"><i class="fa-brands fa-instagram text-pink-500 mr-3 text-3xl"></i> Instagram AI AutoPilot</h1>
            <span class="bg-green-600/20 text-green-400 border border-green-600 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center shadow-lg"><i class="fa-solid fa-circle-play mr-2 animate-pulse"></i> Agent Protected & Active</span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card p-6 flex flex-col items-center">
                <h3 class="text-gray-400 mb-4 font-semibold"><i class="fa-solid fa-heart text-red-500 mr-2"></i> Likes Today</h3>
                <div class="stat-circle w-32 border-red-500">
                    <div class="stat-value"><span id="likes-count" class="text-3xl font-bold text-white">0</span><br><span id="likes-limit" class="text-xs text-gray-400">/ 0</span></div>
                </div>
            </div>
            <div class="card p-6 flex flex-col items-center">
                <h3 class="text-gray-400 mb-4 font-semibold"><i class="fa-solid fa-comment text-blue-500 mr-2"></i> Comments Today</h3>
                <div class="stat-circle w-32 border-blue-500">
                    <div class="stat-value"><span id="comments-count" class="text-3xl font-bold text-white">0</span><br><span id="comments-limit" class="text-xs text-gray-400">/ 0</span></div>
                </div>
            </div>
            <div class="card p-6 flex flex-col items-center">
                <h3 class="text-gray-400 mb-4 font-semibold"><i class="fa-solid fa-paper-plane text-purple-500 mr-2"></i> DMs Replied</h3>
                <div class="stat-circle w-32 border-purple-500">
                    <div class="stat-value"><span id="dms-count" class="text-3xl font-bold text-white">0</span><br><span id="dms-limit" class="text-xs text-gray-400">/ 0</span></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 card p-0 overflow-hidden relative shadow-xl">
                <div class="bg-gray-800 p-3 border-b border-gray-700 flex justify-between items-center text-sm">
                    <span class="font-bold tracking-wider text-gray-300"><i class="fa-solid fa-terminal mr-2"></i> LIVE AI TERMINAL LOGS</span>
                    <span class="text-green-500 animate-pulse"><i class="fa-solid fa-wifi mr-1"></i> Connected</span>
                </div>
                <div id="logs" class="log-container p-4 text-sm whitespace-pre-wrap text-gray-300 scroll-smooth"></div>
            </div>
            
            <div class="card p-6 h-fit bg-gradient-to-b from-[#161b22] to-[#0d1117]">
                <h3 class="font-bold mb-4 pb-2 border-b border-gray-700 text-white uppercase tracking-wider">Engine Stats</h3>
                <div class="space-y-4 text-sm">
                    <div class="flex justify-between items-center bg-gray-900/50 p-2 rounded">
                        <span class="text-gray-400">AI Model</span>
                        <span id="ai-provider" class="font-mono text-blue-400 bg-blue-900/30 px-2 py-0.5 rounded">Loading...</span>
                    </div>
                    <div class="flex justify-between items-center bg-gray-900/50 p-2 rounded">
                        <span class="text-gray-400">Safety Profile</span>
                        <span id="safety-profile" class="font-mono text-yellow-400 bg-yellow-900/30 px-2 py-0.5 rounded">Loading...</span>
                    </div>
                    <div>
                        <span class="text-gray-400 block mb-2 font-medium">Target Hashtags</span>
                        <div id="hashtags-list" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(str) { return str.replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        
        async function updateDashboard() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                document.getElementById('likes-count').innerText = data.stats.likesToday;
                document.getElementById('likes-limit').innerText = '/ ' + data.limits.dailyLikes;
                
                document.getElementById('comments-count').innerText = data.stats.commentsToday;
                document.getElementById('comments-limit').innerText = '/ ' + data.limits.dailyComments;
                
                document.getElementById('dms-count').innerText = data.stats.dMsToday;
                document.getElementById('dms-limit').innerText = '/ ' + data.limits.dailyDMs;
                
                document.getElementById('ai-provider').innerText = (data.config.ai_provider + ' ' + (data.config.ai_model || '')).toUpperCase();
                document.getElementById('safety-profile').innerText = String(data.config.profile).toUpperCase();
                
                const tagBox = document.getElementById('hashtags-list');
                tagBox.innerHTML = '';
                data.config.hashtags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'bg-gray-800 text-gray-300 px-2 py-1 rounded text-xs border border-gray-600';
                    span.innerText = '#' + tag;
                    tagBox.appendChild(span);
                });
            } catch(e) {}
        }

        async function updateLogs() {
            try {
                const res = await fetch('/api/logs');
                const data = await res.json();
                const logBox = document.getElementById('logs');
                
                let isScrolledToBottom = logBox.scrollHeight - logBox.clientHeight <= logBox.scrollTop + 20;
                
                logBox.innerHTML = data.logs.map(line => {
                    let color = 'text-gray-300'; // INFO
                    if(line.includes('ERROR:')) color = 'text-red-400 font-bold';
                    else if(line.includes('SUCCESS:')) color = 'text-green-400';
                    else if(line.includes('WARN:')) color = 'text-yellow-400';
                    else if(line.includes('DEBUG:')) color = 'text-gray-500';
                    else if(line.includes('[Explore]')) color = 'text-blue-400';
                    else if(line.includes('[AI Reading]')) color = 'text-purple-400';
                    
                    return `<div class="${color} mb-1">${escapeHtml(line)}</div>`;
                }).join('');
                
                if (isScrolledToBottom) { logBox.scrollTop = logBox.scrollHeight; }
            } catch(e) {}
        }

        setInterval(updateDashboard, 5000);
        setInterval(updateLogs, 2000);
        updateDashboard();
        updateLogs();
    </script>
</body>
</html>
